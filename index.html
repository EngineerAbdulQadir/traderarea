<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfb" />
    <meta name="description" content="Traders Area — a clean trading journal for tracking trades, reviewing performance, and sharpening your edge." />
    <meta property="og:title" content="Traders Area" />
    <meta property="og:description" content="Traders Area — a clean trading journal for tracking trades, reviewing performance, and sharpening your edge." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,380&family=Inter:wght@300;400;500;560&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Traders Area</title>
    <script>
      ;(function () {
        try {
          var key = 'ta-theme'
          var stored = localStorage.getItem(key)
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
               : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.classList.add(theme)
          root.style.colorScheme = theme
           root.style.backgroundColor = theme === 'dark' ? '#0f1113' : '#fbfbfb'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1113' : '#fbfbfb')
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
