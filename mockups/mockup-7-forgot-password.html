<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup 7 — Forgot Password</title>
<style>
  @font-face {
    font-family: "InterVariable";
    src: url("../fonts/InterVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --paper: #eef3fb;
    --card: #fbfdff;
    --ink: #0a1a33;
    --ink-2: #223650;
    --muted: #5a6b83;
    --faint: #8a99ae;
    --line: rgba(10, 26, 51, 0.15);
    --accent: #00225a;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "InterVariable", "Inter", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 404px;
    padding: 40px 38px 34px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: 0 30px 70px -50px rgba(0, 34, 90, 0.45);
  }
  .card h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .card .sub { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

  form { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .label {
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 650;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .line-input {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    border-bottom: 1px solid var(--line);
    transition: border-color 0.2s var(--ease);
  }
  .line-input.focus { border-color: var(--accent); }
  .line-input input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  .line-input input::placeholder { color: var(--faint); }
  .eye { display: grid; place-items: center; padding: 2px; border: none; background: transparent; color: var(--faint); cursor: pointer; }
  .eye:hover { color: var(--ink); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px; }
  .remember { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; cursor: pointer; }
  .remember input { width: 13px; height: 13px; accent-color: var(--accent); cursor: pointer; }
  .link {
    padding: 0 0 1px;
    border: none;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 560;
    cursor: pointer;
  }
  .link:hover { border-color: var(--accent); }
  .submit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 48px;
    margin-top: 4px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    background: var(--accent);
    color: #f6f9ff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.2s var(--ease);
  }
  .submit:hover { background: transparent; color: var(--accent); }

  .switch { margin: 24px 0 0; color: var(--muted); font-size: 11.5px; text-align: center; }
  .legal { margin: 26px 0 0; color: var(--faint); font-size: 10px; line-height: 1.65; text-align: center; }
  .legal span { border-bottom: 1px solid var(--line); cursor: pointer; }

  @media (max-width: 520px) {
    .page { padding: 20px; }
    .card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Forgot password</h1>
      <p class="sub">Enter your email and we'll send you a secure reset link.</p>

      <form onsubmit="event.preventDefault()">
        <label class="field">
          <span class="label">Email address</span>
          <span class="line-input focus">
            <input type="email" placeholder="you@example.com" value="alex@traderarea.com" />
          </span>
        </label>
        <button type="submit" class="submit">
          Send reset link
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <p class="switch">Remember your password? <button class="link">Sign in</button></p>
      <p class="legal">By continuing you agree to our <span>Terms of Service</span> and <span>Privacy Policy</span>.</p>
    </div>
  </div>
</body>
</html>
