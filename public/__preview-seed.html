<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seed preview</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search)
      const theme = params.get('theme') === 'light' ? 'light' : 'dark'
      const hero = params.get('hero') === 'b' || params.get('hero') === 'c' ? params.get('hero') : 'a'
      const account = {
        id: 'acct_preview',
        firm: 'Eze Funded',
        firmBadge: 'EZ',
        firmGradient: 'linear-gradient(135deg, var(--primary) 0%, var(--accent-dim) 100%)',
        type: 'step1',
        size: 2500,
        challengeSize: 2500,
        stage: 'Phase 1',
        platform: 'MT5',
        startDate: '2026-11-01',
        currency: 'USD',
        startingBalance: 2500,
        rules: { target: 12, daily: 4, max: 8, days: 5 },
        source: 'manual',
        createdAt: new Date().toISOString(),
      }
      const trades = [
        { id: 'preview-1', date: '2026-11-01', ticker: 'EURUSD', side: 'LONG', pnl: 12 },
        { id: 'preview-2', date: '2026-11-02', ticker: 'GBPUSD', side: 'SHORT', pnl: -7 },
        { id: 'preview-3', date: '2026-11-03', ticker: 'USDJPY', side: 'LONG', pnl: 18 },
        { id: 'preview-4', date: '2026-11-04', ticker: 'AUDUSD', side: 'LONG', pnl: 4 },
        { id: 'preview-5', date: '2026-11-04', ticker: 'XAUUSD', side: 'SHORT', pnl: -4 },
      ].map((trade, index) => ({
        ...trade,
        accountId: account.id,
        openTime: '09:35:00',
        closeTime: '10:12:00',
        instrument: `${trade.ticker} · Forex`,
        volume: 0.1,
        entry: 1,
        exit: 1,
        gross: trade.pnl,
        fees: 0,
        roi: trade.pnl / 2500,
        rMultiple: trade.pnl / 10,
        risk: 10,
        playbook: index % 2 ? 'Liquidity Sweep' : 'VWAP Reclaim',
        quality: 78,
        tags: [],
        note: '',
        manual: true,
      }))
      localStorage.setItem('ta-accounts', JSON.stringify([account]))
      localStorage.setItem('ta-active-account', account.id)
      localStorage.setItem('ta-trades', JSON.stringify(trades))
      localStorage.setItem('ta-notes', '{}')
      localStorage.setItem('ta-theme', theme)
      localStorage.setItem('ta-dashboard-from', '2026-11-01')
      localStorage.setItem('ta-dashboard-to', '2026-11-04')
      location.replace(`/?hero=${hero}`)
    </script>
  </body>
</html>
